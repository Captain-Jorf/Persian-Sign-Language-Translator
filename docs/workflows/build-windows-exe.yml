name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, runtime dependencies, and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run tests before packaging
        run: python -m unittest discover -s tests
      - name: Build executable
        run: python scripts/build_exe.py
      - name: Test executable help
        run: .\release\PersianSignLanguageTranslator.exe --help
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianSignLanguageTranslator-windows-exe
          path: release/PersianSignLanguageTranslator.exe
